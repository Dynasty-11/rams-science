<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2457d6">
<title>Science Bowl Offline</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#d8dee5;--blue:#2457d6;--green:#16794b;--red:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 16px rgba(0,0,0,.07)}
h1{font-size:25px;margin:0 0 5px}
h2{font-size:20px;margin:0 0 14px}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.controls{display:grid;gap:10px}
label{font-size:13px;font-weight:600}
select,button{width:100%;min-height:48px;border-radius:12px;font-size:16px;padding:10px 13px;border:1px solid var(--line)}
select{background:#fff;color:var(--text)}
button{border:0;background:var(--blue);color:#fff;font-weight:650;touch-action:manipulation}
button.secondary{background:#e9edf2;color:var(--text)}
button.good{background:var(--green)}
button.bad{background:var(--red)}
button:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.q{font-size:21px;line-height:1.5;margin:18px 0}
.answer{padding:14px;border-radius:12px;background:#edf8f1;margin-top:13px;line-height:1.5;display:none}
.answer.wrong{background:#fff1f0}
progress{width:100%;height:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:#eef2ff;color:#3349a8;padding:5px 9px;border-radius:999px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#f7f8fa;border-radius:12px;padding:12px}
.num{font-size:22px;font-weight:700}
.hidden{display:none!important}
#status{padding:10px;border-radius:10px;background:#f7f8fa;margin-top:10px}
@media(min-width:600px){.controls{grid-template-columns:repeat(3,1fr);align-items:end}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>National Science Bowl — Offline</h1>
    <div class="muted">Safari-ready single-file practice app. No internet, API, library, or external file required.</div>
    <div id="status" class="muted">Starting…</div>
  </div>

  <section class="card" id="setup">
    <h2>Start Practice</h2>
    <div class="controls">
      <div><label for="subject">Subject</label><select id="subject">
        <option value="">All subjects</option>
        <option>BIOLOGY</option><option>CHEMISTRY</option><option>EARTH AND SPACE</option>
        <option>ENERGY</option><option>MATH</option><option>PHYSICS</option>
      </select></div>
      <div><label for="count">Questions</label><select id="count">
        <option value="10">10</option><option value="25">25</option><option value="50">50</option>
        <option value="80">80</option>
      </select></div>
      <div><label>&nbsp;</label><button id="startBtn" type="button">Start Practice</button></div>
    </div>
  </section>

  <section class="card hidden" id="quiz">
    <div class="tags"><span class="tag" id="meta"></span><span class="tag" id="subjectTag"></span></div>
    <progress id="prog" value="0" max="1"></progress>
    <div class="q" id="question"></div>
    <div class="actions">
      <button id="correctBtn" class="good" type="button">Correct</button>
      <button id="incorrectBtn" class="bad" type="button">Incorrect</button>
    </div>
    <button id="revealBtn" class="secondary" type="button" style="margin-top:9px">Reveal Answer</button>
    <div class="answer" id="answer"></div>
    <div class="actions" style="margin-top:12px">
      <button id="nextBtn" type="button">Next →</button>
      <button id="endBtn" class="secondary" type="button">End Practice</button>
    </div>
  </section>

  <section class="card">
    <h2>Progress</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="seen">0</div><div class="muted">Answered</div></div>
      <div class="stat"><div class="num" id="correct">0</div><div class="muted">Correct</div></div>
      <div class="stat"><div class="num" id="pct">0%</div><div class="muted">Accuracy</div></div>
      <div class="stat"><div class="num" id="score">0</div><div class="muted">Points</div></div>
    </div>
    <button id="missedBtn" class="secondary" type="button" style="margin-top:12px">Review Missed</button>
    <button id="resetBtn" class="secondary" type="button" style="margin-top:8px">Reset Progress</button>
    <div id="subjectStats" class="muted" style="margin-top:12px"></div>
  </section>
</div>

let session = [];
let position = 0;
let locked = false;
let history = Object.create(null);

/* Storage is optional. The quiz never depends on it. */
try {
  const k = "__science_bowl_test__";
  window.localStorage.setItem(k, "1");
  window.localStorage.removeItem(k);
  history = JSON.parse(window.localStorage.getItem("scienceBowlHistory") || "{}");
  if (!history || typeof history !== "object") history = Object.create(null);
} catch (e) {
  history = Object.create(null);
}

const $ = id => document.getElementById(id);

function saveHistory() {
  try {
    window.localStorage.setItem("scienceBowlHistory", JSON.stringify(history));
  } catch (e) {}
  updateStats();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[ch]);
}

function updateStats() {
  const vals = Object.values(history);
  const answered = vals.length;
  const correct = vals.filter(x => x.correct).length;
  const points = vals.reduce((n,x) => n + (x.correct ? 4 : 0), 0);
  $("seen").textContent = answered;
  $("correct").textContent = correct;
  $("pct").textContent = answered ? Math.round(correct / answered * 100) + "%" : "0%";
  $("score").textContent = points;

  const by = {};
  vals.forEach(x => {
    if (!by[x.subject]) by[x.subject] = [0,0];
    by[x.subject][1]++;
    if (x.correct) by[x.subject][0]++;
  });
  $("subjectStats").textContent =
    Object.entries(by).map(([s,v]) => `${s}: ${v[0]}/${v[1]} (${Math.round(v[0]/v[1]*100)}%)`).join(" • ")
    || "No answers recorded yet.";
}

function getQuestions() {
  const subject = $("subject").value;
  return BANK.filter(q => !subject || q.category === subject);
}

function startPractice(useMissed=false) {
  let pool = useMissed
    ? getQuestions().filter(q => history[q.id] && !history[q.id].correct)
    : getQuestions();

  if (!pool.length) {
    alert(useMissed ? "You have no missed questions for this subject yet." : "No questions match that subject.");
    return;
  }

  const requested = Number($("count").value);
  const n = Math.min(requested, pool.length);
  session = pool.slice().sort(() => Math.random() - 0.5).slice(0, n);
  position = 0;
  $("setup").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}

function render() {
  const q = session[position];
  locked = false;
  $("meta").textContent = `Question ${position + 1} of ${session.length}`;
  $("subjectTag").textContent = q.category;
  $("prog").value = position + 1;
  $("prog").max = session.length;
  $("question").textContent = q.tossup_question;
  $("answer").style.display = "none";
  $("answer").className = "answer";
  $("answer").innerHTML = "<b>Answer:</b> " + escapeHTML(q.tossup_answer) +
    "<br><span class='muted'>Offline Practice Bank</span>";
}

function mark(correct) {
  if (locked) return;
  locked = true;
  const q = session[position];
  history[q.id] = {
    correct,
    subject:q.category,
    question:q.tossup_question,
    answer:q.tossup_answer,
    at:Date.now()
  };
  saveHistory();
  $("answer").style.display = "block";
  $("answer").classList.toggle("wrong", !correct);
}

function nextQuestion() {
  if (!locked) {
    alert("Choose Correct or Incorrect first.");
    return;
  }
  if (position + 1 < session.length) {
    position++;
    render();
  } else {
    $("quiz").classList.add("hidden");
    $("setup").classList.remove("hidden");
    alert("Practice complete! Your score has been updated.");
  }
}

function endPractice() {
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
}

$("startBtn").addEventListener("click", () => startPractice(false));
$("correctBtn").addEventListener("click", () => mark(true));
$("incorrectBtn").addEventListener("click", () => mark(false));
$("revealBtn").addEventListener("click", () => {
  $("answer").style.display = "block";
});
$("nextBtn").addEventListener("click", nextQuestion);
$("endBtn").addEventListener("click", endPractice);
$("missedBtn").addEventListener("click", () => startPractice(true));
$("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all saved progress?")) {
    history = Object.create(null);
    try { window.localStorage.removeItem("scienceBowlHistory"); } catch(e) {}
    updateStats();
  }
});

/* Startup diagnostics: if JavaScript runs, this message changes immediately. */
$("status").textContent =
  "READY • " + BANK.length + " questions embedded • JavaScript is running • Internet not required.";
updateStats();
</script>
